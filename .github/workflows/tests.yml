name: Tests (contract + adversarial crypto + authority + order binding + browser parity)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Seed GenVM runner tarball (gltest 0.29.2 direct mode)
        run: |
          python - <<'EOF'
          import urllib.request, os
          home = os.path.expanduser('~/.cache/gltest-direct')
          os.makedirs(home, exist_ok=True)
          dst = home + '/genvm-universal-v0.3.0-rc7.tar.xz'
          if not os.path.exists(dst):
              urllib.request.urlretrieve(
                  'https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz',
                  dst)
          print('seeded', dst)
          EOF

      - name: "Contract tests — adjudication + adversarial Ed25519 + snapshot authority + order binding (73)"
        working-directory: tests/direct
        run: python -m pytest test_adversarial_ed25519.py test_authority.py test_gendid_judge.py test_order_binding.py -v

      - name: "Browser/contract parity + dual-runner corpus + manifest parity (61 checks)"
        run: node tests/js/test-parity.mjs

      - name: "Steward attack reproducer (identity key + zero scalar + torsion + manifest-authority attacks)"
        run: |
          python3 scripts/attack_repro.py contracts/gendid_judge.py | tee repro.log
          if grep -q "ACCEPTS  : True" repro.log; then
            echo "FATAL - Ed25519 attack accepted"
            exit 1
          fi
          if grep -q "authority verifies      : True" repro.log && \
             grep -q "ok=True" repro.log; then
            echo "FATAL - manifest authority accepted a manipulated snapshot"
            exit 1
          fi
