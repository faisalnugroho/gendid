name: Tests (contract + adversarial crypto + order binding + browser parity)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install "genlayer-test==0.29.2" pytest cryptography requests
          python -c "import urllib.request, os; home=os.path.expanduser('~/.cache/gltest-direct'); os.makedirs(home, exist_ok=True); dst=home+'/genvm-universal-v0.3.0-rc7.tar.xz'; urllib.request.urlretrieve('https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz', dst) if not os.path.exists(dst) else None; print('seeded', dst)"

      - name: "Contract tests (50) - adjudication + adversarial Ed25519 + order binding"
        working-directory: tests/direct
        run: python -m pytest test_adversarial_ed25519.py test_gendid_judge.py test_order_binding.py -v

      - name: "Browser/contract parity + dual-runner corpus (48 checks)"
        run: node tests/js/test-parity.mjs

      - name: "Steward attack reproducer must reject (identity key + zero scalar + torsion sweep)"
        run: |
          python3 scripts/attack_repro.py contracts/gendid_judge.py | tee repro.log
          if grep -q "ACCEPTS  : True" repro.log; then
            echo "FATAL - attack accepted"
            exit 1
          fi
